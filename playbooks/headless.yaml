- name: Initial setup for a headless Fedora system
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  pre_tasks:
    - ansible.builtin.include_tasks: common_tasks/pre_config.yaml

  roles:
    - role: base_setup
      tags:
        - packages
        - readline
        - ssh
    - role: dev_tools
      tags:
        - git
        - podman
        - nix
        - starship

  post_tasks:
    - ansible.builtin.include_tasks: common_tasks/post_config.yaml
